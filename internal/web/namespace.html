{{ define "namespace.html" }}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Namespace 详情 · BCS Agent</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f7fb; color: #172033; }
    header { padding: 22px 32px; color: #fff; background: #182b56; }
    header a { color: #bdcae5; text-decoration: none; font-size: 13px; }
    header h1 { margin: 12px 0 5px; font-size: 22px; }
    header p { margin: 0; color: #bdcae5; font-size: 14px; }
    main { max-width: 1180px; margin: 26px auto; padding: 0 24px 40px; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
    .metric, .panel { border: 1px solid #e2e8f2; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(31, 50, 86, .05); }
    .metric { padding: 18px 20px; }
    .metric span { color: #66758a; font-size: 12px; }
    .metric strong { display: block; margin-top: 7px; font-size: 24px; }
    .panel { margin-top: 16px; overflow: hidden; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #edf1f7; }
    .panel-head h2 { margin: 0; font-size: 16px; }
    .hint { color: #718096; font-size: 12px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 20px; border-bottom: 1px solid #edf1f7; text-align: left; font-size: 13px; vertical-align: top; }
    th { color: #526176; background: #f8fafd; font-size: 12px; white-space: nowrap; }
    tr.abnormal { background: #fff8f6; }
    button { padding: 8px 12px; border: 0; border-radius: 7px; color: #fff; background: #1768e5; cursor: pointer; white-space: nowrap; }
    button:disabled { cursor: wait; opacity: .6; }
    .empty, .loading, .error { padding: 38px 20px; text-align: center; color: #718096; }
    .error { color: #b42318; }
    .diagnosis { display: none; padding: 20px; white-space: pre-wrap; line-height: 1.65; }
    .diagnosis.active { display: block; }
    .progress { margin-bottom: 10px; color: #607089; font-size: 12px; }
    @media (max-width: 700px) { header { padding: 20px; } main { padding: 0 12px 30px; } .metrics { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <a href="/clusters/{{ .ClusterID }}">← 返回 Namespace 列表</a>
    <h1 id="namespace-name">{{ .Namespace }}</h1>
    <p id="cluster-meta">{{ .ClusterID }}</p>
  </header>
  <main>
    <div class="metrics">
      <div class="metric"><span>Deployment</span><strong id="deployment-count">—</strong></div>
      <div class="metric"><span>Pod / 异常</span><strong id="pod-count">—</strong></div>
      <div class="metric"><span>Warning Event</span><strong id="event-count">—</strong></div>
    </div>

    <section class="panel">
      <div class="panel-head"><h2>Deployment</h2><span id="deployment-hint" class="hint"></span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>名称</th><th>期望副本</th><th>就绪副本</th><th>可用副本</th><th>更新副本</th></tr></thead>
        <tbody id="deployments"><tr><td colspan="5" class="loading">正在查询...</td></tr></tbody>
      </table></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Pod</h2><span id="pod-hint" class="hint">异常 Pod 优先展示</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Pod</th><th>阶段</th><th>原因</th><th>容器就绪</th><th>重启次数</th><th></th></tr></thead>
        <tbody id="pods"><tr><td colspan="6" class="loading">正在查询...</td></tr></tbody>
      </table></div>
    </section>

    <section id="diagnosis-panel" class="panel diagnosis">
      <div id="diagnosis-progress" class="progress"></div>
      <div id="diagnosis-answer"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Warning Event</h2><span id="event-hint" class="hint"></span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>原因</th><th>对象</th><th>消息</th><th>次数</th></tr></thead>
        <tbody id="events"><tr><td colspan="4" class="loading">正在查询...</td></tr></tbody>
      </table></div>
    </section>
  </main>
  <script>
    const clusterID = {{ .ClusterID }};
    const namespace = {{ .Namespace }};

    function addCell(row, value) {
      const cell = document.createElement('td');
      cell.textContent = value === undefined || value === null || value === '' ? '—' : String(value);
      row.appendChild(cell);
      return cell;
    }

    function showTableMessage(target, columns, message, className) {
      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = columns;
      cell.className = className;
      cell.textContent = message;
      row.appendChild(cell);
      target.replaceChildren(row);
    }

    function podIsAbnormal(pod) {
      return pod.details.phase !== 'Running' || Number(pod.details.ready_containers || 0) < Number(pod.details.total_containers || 0);
    }

    function podReason(pod) {
      if (pod.details.reason) return pod.details.reason;
      const container = pod.details.containers?.find(item => item.reason);
      if (container) return container.reason;
      return pod.details.conditions?.find(item => item.reason)?.reason || '';
    }

    async function diagnosePod(pod, button) {
      button.disabled = true;
      const panel = document.querySelector('#diagnosis-panel');
      const progress = document.querySelector('#diagnosis-progress');
      const answer = document.querySelector('#diagnosis-answer');
      panel.classList.add('active');
      progress.textContent = `正在分析 ${namespace}/${pod.name}...`;
      answer.textContent = '';
      answer.className = '';
      try {
        const response = await fetch('/api/v1/diagnoses', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({cluster_id: clusterID, namespace, kind: 'Pod', name: pod.name})
        });
        if (!response.ok) {
          const result = await response.json();
          throw new Error(result.error?.message || '分析请求失败');
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const {value, done} = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), {stream: !done});
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (!line) continue;
            const event = JSON.parse(line);
            if (event.type === 'text_delta') answer.textContent += event.content;
            if (event.type === 'tool_call') progress.textContent = `正在调用 ${event.tool_name}...`;
            if (event.type === 'tool_result') progress.textContent = `${event.tool_name} 查询完成，继续分析...`;
            if (event.type === 'error') throw new Error(event.content);
            if (event.type === 'done') progress.textContent = `已完成 ${namespace}/${pod.name} 的分析`;
          }
          if (done) break;
        }
      } catch (error) {
        progress.textContent = '分析失败';
        answer.textContent = error.message;
        answer.className = 'error';
      } finally {
        button.disabled = false;
        panel.scrollIntoView({behavior: 'smooth', block: 'start'});
      }
    }

    async function loadOverview() {
      try {
        const url = `/api/v1/clusters/${encodeURIComponent(clusterID)}/namespaces/${encodeURIComponent(namespace)}/overview`;
        const response = await fetch(url);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || '查询 Namespace 概览失败');
        document.querySelector('#namespace-name').textContent = result.namespace.name;
        document.querySelector('#cluster-meta').textContent = `${result.cluster.cluster_name || result.cluster.cluster_id} · ${result.cluster.cluster_id}`;
        const abnormalCount = result.pods.filter(podIsAbnormal).length;
        document.querySelector('#deployment-count').textContent = result.deployments.length;
        document.querySelector('#pod-count').textContent = `${result.pods.length} / ${abnormalCount}`;
        document.querySelector('#event-count').textContent = result.warning_events.length;
        if (result.deployments_has_more) document.querySelector('#deployment-hint').textContent = '仅展示首批 100 条';
        if (result.pods_has_more) document.querySelector('#pod-hint').textContent = '异常优先，仅展示首批 100 条';
        if (result.events_has_more) document.querySelector('#event-hint').textContent = '仅展示首批 100 条';

        const deployments = document.querySelector('#deployments');
        deployments.replaceChildren();
        for (const deployment of result.deployments) {
          const row = document.createElement('tr');
          addCell(row, deployment.name);
          addCell(row, deployment.details.desired_replicas);
          addCell(row, deployment.details.ready_replicas);
          addCell(row, deployment.details.available_replicas);
          addCell(row, deployment.details.updated_replicas);
          deployments.appendChild(row);
        }
        if (!result.deployments.length) showTableMessage(deployments, 5, '没有找到 Deployment', 'empty');

        const pods = document.querySelector('#pods');
        pods.replaceChildren();
        for (const pod of result.pods) {
          const row = document.createElement('tr');
          if (podIsAbnormal(pod)) row.className = 'abnormal';
          addCell(row, pod.name);
          addCell(row, pod.details.phase);
          addCell(row, podReason(pod));
          addCell(row, `${pod.details.ready_containers || 0} / ${pod.details.total_containers || 0}`);
          addCell(row, pod.details.restart_count);
          const action = document.createElement('td');
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'AI 分析';
          button.addEventListener('click', () => diagnosePod(pod, button));
          action.appendChild(button);
          row.appendChild(action);
          pods.appendChild(row);
        }
        if (!result.pods.length) showTableMessage(pods, 6, '没有找到 Pod', 'empty');

        const events = document.querySelector('#events');
        events.replaceChildren();
        for (const event of result.warning_events) {
          const row = document.createElement('tr');
          addCell(row, event.details.reason);
          const object = event.details.involved_object || {};
          addCell(row, [object.kind, object.name].filter(Boolean).join('/'));
          addCell(row, event.details.message);
          addCell(row, event.details.count);
          events.appendChild(row);
        }
        if (!result.warning_events.length) showTableMessage(events, 4, '没有找到 Warning Event', 'empty');
      } catch (error) {
        showTableMessage(document.querySelector('#deployments'), 5, error.message, 'error');
        showTableMessage(document.querySelector('#pods'), 6, error.message, 'error');
        showTableMessage(document.querySelector('#events'), 4, error.message, 'error');
      }
    }

    loadOverview();
  </script>
</body>
</html>
{{ end }}
